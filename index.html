<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a3f9e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Garage 197</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Garage 197. Built from src/ by build.py: edit the parts there, not index.html. */
  /* Palette: white ground, Amethyst text (from the 964's paint), brass kept for highlights only. */
  :root {
    --bg: #ffffff; --panel: #ffffff; --soft: #f7f3fc; --ink: #4a2a7a; --strong: #35195e; --muted: #77689a; --line: #e4dcf0;
    --accent: #6a3f9e; --accent-ink: #ffffff; --accent-soft: #efe7f9; --hi: #9a6410;
    --ok: #1d7a4c; --bad: #b3372f; --warn: #94600a; --shadow: 0 1px 2px rgb(74 42 122 / .06), 0 6px 18px rgb(74 42 122 / .05);
    --f-display: "Archivo", "IBM Plex Sans Arabic", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #120d1c; --panel: #1b1429; --soft: #241a38; --ink: #e6dcf6; --strong: #f4eefc; --muted: #a99bc4; --line: #34284c;
    --accent: #b794e8; --accent-ink: #1a1424; --accent-soft: #2e2247; --hi: #e0b060;
    --ok: #5cc48e; --bad: #f0857c; --warn: #e0b060; --shadow: none; color-scheme: dark }
  @media (prefers-color-scheme: dark) { :root[data-theme="auto"] {
    --bg: #120d1c; --panel: #1b1429; --soft: #241a38; --ink: #e6dcf6; --strong: #f4eefc; --muted: #a99bc4; --line: #34284c;
    --accent: #b794e8; --accent-ink: #1a1424; --accent-soft: #2e2247; --hi: #e0b060;
    --ok: #5cc48e; --bad: #f0857c; --warn: #e0b060; --shadow: none; color-scheme: dark } }
  html[lang="ar"] { --f-display: "IBM Plex Sans Arabic", "Archivo", sans-serif; --f-body: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif; }
  html[lang="ar"] body { line-height: 1.75; }
  html[lang="ar"] :is(.label, th, .tag, dl.facts dt) { letter-spacing: 0; font-size: .8rem; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, .big, .stat b, .card b { color: var(--strong); }
  h1 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.01em; text-wrap: balance; }
  h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; text-wrap: balance; }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin-inline: auto; padding-block: 20px 56px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .between { justify-content: space-between; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .label { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .empty { color: var(--muted); max-width: 56ch; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 20px; align-items: start; }

  /* header and tabs */
  .head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; }
  .tab { font: inherit; font-weight: 600; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  .tab svg, .btn svg { width: 1.15em; height: 1.15em; flex: none; }
  .tab[aria-current="page"] { color: var(--strong); }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  @media (max-width: 640px) {
    .head .tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); justify-content: space-around; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .head .tab { flex: 1; flex-direction: column; gap: 2px; justify-content: center; font-size: .7rem; border-bottom: 0; border-top: 3px solid transparent; padding: 8px 1px 9px; max-width: none; min-width: 0; }
    .head .tab svg { width: 1.5rem; height: 1.5rem; }
    .head #t-settings { display: none; }
    .head .tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .head .tab[aria-current="page"] { border-top-color: var(--accent); }
    .head { border-bottom: 0; }
    .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  }

  /* forms */
  form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: .82rem; font-weight: 500; }
  .combo { position: relative; } .combo-list { position: absolute; z-index: 20; inset-inline: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--bg, #fff); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 15rem; overflow-y: auto; }
  .combo-list li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; text-align: start; padding: 9px 10px; border-radius: 6px; cursor: pointer; } .combo-list li:hover { background: var(--accent-soft); } .combo-list li .small { white-space: nowrap; flex: none; }
  input[type=file] { max-width: 100%; overflow: hidden; }
  @media (pointer: coarse) { input, select, textarea { font-size: 16px; } }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-width: 0; width: 100%; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .mono { font-family: var(--f-mono); letter-spacing: .04em; }
  .hint { font-size: .78rem; color: var(--muted); }
  .btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: .85rem; }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: start; }
  :is(.btn, .tab, .card, .chip, .linkbtn, input, select, textarea, a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  details.more > summary { cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--accent); }
  details.more[open] > summary { margin-bottom: 12px; }
  details.more > div { display: flex; flex-direction: column; gap: 12px; }
  .login { max-width: 26rem; margin: 5vh auto 0; display: flex; flex-direction: column; gap: 18px; width: 100%; }

  /* garage cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 18px; }
  .card { font: inherit; color: inherit; text-align: start; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; padding: 0; }
  .card:hover { border-color: var(--accent); }
  .photo { aspect-ratio: 4 / 3; background: linear-gradient(160deg, var(--accent-soft), var(--soft)); display: grid; place-items: center; color: var(--accent); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo svg { width: 38%; height: auto; opacity: .55; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 3px; }
  .card b { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--accent-soft); color: var(--accent); }
  .badge.due { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }
  .hero .photo { border-radius: 8px; border: 1px solid var(--line); }
  dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 12px 18px; margin: 0; }
  dl.facts div { display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; overflow-wrap: anywhere; }
  dl.facts dt { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  dl.facts dd { margin: 0; }

  /* numbers */
  .big { font-family: var(--f-display); font-stretch: 110%; font-weight: 700; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 14px 20px; }
  .stat { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
  .stat b { font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .up { color: var(--ok); } .down { color: var(--bad); }
  .tablebox { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th { text-align: start; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th, td { padding: 7px 0; padding-inline-end: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: end; }
  td:first-child { white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; }
  .chart { position: relative; direction: ltr; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; font-size: .8rem; box-shadow: 0 4px 14px rgb(0 0 0 / .14); max-width: 15rem; }

  /* chassis plate */
  .plate { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
  .seg { border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px 7px; display: flex; flex-direction: column; gap: 2px; background: var(--soft); min-width: 0; }
  .seg b { font-family: var(--f-mono); font-weight: 500; font-size: 1.1rem; letter-spacing: .12em; }
  .seg em { font-style: normal; font-size: .8rem; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .flag.ok::before { background: var(--ok); } .flag.bad::before { background: var(--bad); } .flag.warn::before { background: var(--warn); }

  /* logbook */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: .8rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; background: transparent; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .log li { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .log .when { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 2px; }
  .log .what { display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
  .tag { font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
  .tag.s-good { color: var(--ok); } .tag.s-fair { color: var(--warn); } .tag.s-attention, .tag.s-overdue { color: var(--bad); } .tag.s-soon { color: var(--warn); }
  @media (max-width: 480px) { .log li { grid-template-columns: minmax(0, 1fr); } .log .when { flex-direction: row; gap: 10px; } }
  .due-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .due-list li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }

  /* brand, login, hero, charts, motion */
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--strong); padding-block: 8px; }
  .brand svg { width: 2.2rem; height: 2.2rem; color: var(--accent); flex: none; }
  .brand b { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; }
  .signin { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin-top: 3vh; background: var(--panel); }
  .signin .art { background: linear-gradient(150deg, #35195e, #6a3f9e 60%, #8f5fc4); color: #fff; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-height: 26rem; background-size: cover; background-position: center; }
  .signin .art h1, .signin .art b { color: #fff; } .signin .art .brand svg { color: #fff; }
  .signin .art p { font-size: 1.15rem; line-height: 1.45; max-width: 26ch; text-wrap: balance; }
  .signin .art .car { width: 100%; opacity: .9; }
  .signin .form { padding: 32px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
  @media (max-width: 760px) { .signin { grid-template-columns: minmax(0, 1fr); margin-top: 0; } .signin .art { min-height: 0; padding: 22px; } .signin .art .car { max-width: 15rem; } .signin .form { padding: 22px; } }
  .banner { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 21 / 9; background: linear-gradient(150deg, #35195e, #6a3f9e 60%, #8f5fc4); display: grid; place-items: center; color: #fff; }
  @media (max-width: 760px) { .banner { aspect-ratio: 4 / 3; } }
  .banner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .banner > svg { width: 34%; opacity: .5; }
  .banner.has-photo > svg { display: none; }
  .members { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .member { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; min-width: 0; }
  .member:hover { background: var(--soft); }
  a.who { font-weight: 700; text-decoration: none; color: inherit; } a.who:hover { text-decoration: underline; }
  .avatar.lg { width: 72px; height: 72px; font-size: 1.6rem; flex: none; }
  .chats { list-style: none; margin: 0; padding: 0; } .chats li + li { border-top: 1px solid var(--line); }
  .chatrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 56px; text-decoration: none; color: inherit; }
  .chatrow .count { background: var(--accent); color: #fff; border-radius: 999px; min-width: 1.5rem; height: 1.5rem; display: inline-grid; place-items: center; font-size: .75rem; font-weight: 700; padding: 0 6px; flex: none; }
  .bubbles { display: flex; flex-direction: column; gap: 8px; max-height: 58vh; overflow-y: auto; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
  .bubble { max-width: 82%; align-self: flex-start; background: var(--soft); border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .bubble.mine { align-self: flex-end; background: var(--accent-soft); }
  .bubble p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; } .bubble .small { opacity: .7; font-size: .72rem; }
  .chatform textarea { flex: 1; min-width: 0; }
  .attach { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .attach:empty { display: none; } .attach img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .banner .over { position: absolute; inset-inline: 0; bottom: 0; padding: 48px 20px 16px; background: linear-gradient(to top, rgb(20 8 40 / .82), rgb(20 8 40 / 0)); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 20px; }
  .banner .over h1 { color: #fff; overflow-wrap: anywhere; } .banner .over .v { color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .banner .over small { display: block; font-size: .75rem; opacity: .85; font-weight: 500; font-family: var(--f-body); }
  .range { display: flex; flex-direction: column; gap: 4px; }
  .range .track { position: relative; height: 8px; border-radius: 999px; background: var(--accent-soft); direction: ltr; }
  .range .dot { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); transform: translate(-50%, -50%); box-shadow: 0 0 0 1px var(--accent); }
  .range .ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 3.2rem; gap: 10px; align-items: center; font-size: .88rem; }
  .bar .t { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; direction: ltr; }
  .bar .t i { display: block; height: 100%; border-radius: 999px; }
  .bar .up-bg { background: var(--ok); } .bar .down-bg { background: var(--bad); }
  .bar .p { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; }
  .trend { font-size: .8rem; font-weight: 600; }
  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 10px; }
  .feeditem { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 0; }
  .feeditem:hover { border-color: var(--accent); }
  .feeditem .photo { width: 5.5rem; flex: none; border-radius: 8px; }
  .feeditem b { color: var(--strong); overflow-wrap: anywhere; }
  a.chip { text-decoration: none; }
  .posts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .posts li { border-top: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .posts p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .btn { white-space: nowrap; }
  .bell { position: relative; display: inline-grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 999px; color: var(--muted); margin-inline-start: auto; }
  .bell svg { width: 1.45rem; height: 1.45rem; }
  .bell:hover, .bell[aria-current="page"] { color: var(--strong); background: var(--soft); }
  .bell .count { position: absolute; top: 2px; inset-inline-end: 0; min-width: 1.15rem; height: 1.15rem; padding: 0 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
  .postphoto { display: block; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); cursor: pointer; max-width: min(100%, 26rem); }
  .postphoto img { display: block; width: 100%; height: auto; max-height: 26rem; object-fit: cover; }
  .avatar { width: 2.6rem; height: 2.6rem; flex: none; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-weight: 700; overflow: hidden; }
  .avatar.sm { width: 1.9rem; height: 1.9rem; font-size: .8rem; } .avatar.lg { width: 5rem; height: 5rem; font-size: 1.6rem; }

  'Garage 197 began with a collector and a simple frustration. The paperwork was in one folder, the service history in another, the market in a dozen browser tabs, and the people who love the same cars were scattered across group chats.': 'بدأ Garage 197 بهاوٍ لجمع السيارات وإحباط بسيط: الأوراق في ملف، وسجل الصيانة في ملف آخر، والسوق موزّع على عشرات الصفحات، ومحبو السيارات نفسها متفرقون بين مجموعات المحادثة.',
  'So we set out to make the hobby easier for everyone who loves cars. One place to keep a car’s story. One place to see what the cars you love are really selling for. One place to find the people who love them too.': 'فقررنا أن نجعل الهواية أسهل لكل من يحب السيارات. مكان واحد يحفظ قصة السيارة. مكان واحد يعرض الأسعار الحقيقية للسيارات التي تحبها. ومكان واحد تجد فيه من يحبونها مثلك.',

  'Hard to read': 'صعب القراءة',
  'If you choose “Build from my documents”, the files you pick are sent to Anthropic, the maker of the Claude AI service, so they can be read and turned into draft logbook records. This happens only when you start it. Anthropic processes the files to provide that reading and does not use them to train its AI models.': 'إذا اخترت «أنشئ السجل من مستنداتي» تُرسل الملفات التي تختارها إلى Anthropic، الشركة المطوّرة لخدمة الذكاء الاصطناعي Claude، لقراءتها وتحويلها إلى مسودات سجلات. يحدث ذلك فقط عندما تبدأه أنت. تعالج Anthropic الملفات لتقديم هذه القراءة ولا تستخدمها لتدريب نماذجها.',
  'Include this record': 'أضف هذا السجل',
  'Keep this page open until it finishes.': 'أبقِ هذه الصفحة مفتوحة حتى ينتهي.',
  'Mostly clear': 'واضح في معظمه',
  'No records yet. Add the first one yourself, or choose “Build from my documents” to upload your paperwork and have the logbook drafted for you.': 'لا توجد سجلات بعد. أضف أول سجل بنفسك، أو اختر «أنشئ السجل من مستنداتي» لرفع أوراقك وإعداد مسودة السجل لك.',
  'Not added': 'لم تُضف',
  'Odometer on the document: {a} {u}': 'العداد في المستند: {a} {u}',
  'Over 9 MB. Use a smaller scan.': 'أكبر من 9 ميغابايت. استخدم نسخة أصغر.',
  'Please check: {m}': 'يرجى التحقق: {m}',
  'Read clearly': 'قُرئ بوضوح',
  'Read my documents': 'اقرأ مستنداتي',
  'Reading documents {a} to {b} of {n}. This can take a minute…': 'جارٍ قراءة المستندات {a} إلى {b} من {n}. قد يستغرق ذلك دقيقة…',
  'Reading your documents': 'جارٍ قراءة مستنداتك',
  'Save {n} records to the logbook': 'احفظ {n} سجلات في السجل',
  'Sign in again, then retry.': 'سجّل الدخول من جديد ثم أعد المحاولة.',
  'Starting…': 'جارٍ البدء…',
  'That is more than {n} files. Add them in smaller groups.': 'هذا أكثر من {n} ملفاً. أضفها على مجموعات أصغر.',
  'The AI logbook is not switched on yet. You can still add records yourself.': 'لم يُفعَّل سجل الذكاء الاصطناعي بعد. ما زال بإمكانك إضافة السجلات بنفسك.',
  'The AI service is busy. Wait a minute and try again.': 'خدمة الذكاء الاصطناعي مشغولة. انتظر دقيقة ثم حاول مجدداً.',
  'The documents could not be read just now. Try again.': 'تعذّرت قراءة المستندات الآن. حاول مجدداً.',
  'The records below were read before it stopped.': 'السجلات أدناه قُرئت قبل التوقف.',
  'To read them, your files are sent to Anthropic’s Claude AI service. They stay private to your account and are not used to train AI.': 'لقراءتها تُرسل ملفاتك إلى خدمة الذكاء الاصطناعي Claude من Anthropic. تبقى خاصة بحسابك ولا تُستخدم لتدريب الذكاء الاصطناعي.',
  'Untitled': 'بلا عنوان',
  'Up to {n} files at a time. Clear, straight photos read best.': 'حتى {n} ملفاً في المرة. الصور الواضحة والمستقيمة تُقرأ أفضل.',
  'You have reached this month’s limit for documents read by AI. It resets on the first of the month.': 'بلغت حد هذا الشهر للمستندات المقروءة بالذكاء الاصطناعي. يُعاد الحد في أول الشهر.',
  '{n} records added to the logbook': 'أُضيف {n} سجلات إلى السجل',
  '{n} records were drafted from your documents. Correct anything that was misread, untick anything you do not want, then save.': 'أُعدّت {n} مسودات سجلات من مستنداتك. صحّح ما قُرئ خطأً، وألغِ تحديد ما لا تريده، ثم احفظ.',
  'A project tracks a service, an upgrade or a restoration from start to finish. Post updates with photos and let friends suggest tools and know-how.': 'المشروع يتابع صيانة أو ترقية أو ترميماً من البداية إلى النهاية. انشر التحديثات بالصور ودع أصدقاءك يقترحون الأدوات والخبرات.',
  'Next: build this car’s logbook': 'الخطوة التالية: أنشئ سجل هذه السيارة',
  'Upload photos or PDFs of your invoices, inspection reports and papers. The app reads them and drafts the car’s history for you to check.': 'ارفع صوراً أو ملفات PDF لفواتيرك وتقارير الفحص وأوراقك. يقرأها التطبيق ويُعدّ مسودة لتاريخ السيارة لتراجعها.',
  'Set a reminder': 'أضف تذكيراً',
  'The logbook is this car’s history: services, inspections, documents and costs. The quickest start is to upload your paperwork and let the app draft the records.': 'السجل هو تاريخ هذه السيارة: الصيانة والفحوصات والمستندات والتكاليف. أسرع بداية هي رفع أوراقك وترك التطبيق يُعدّ مسودة السجلات.',
  'Friends can see the garage you choose to share, follow your projects and join your events. Add one by the email they use for Garage 197.': 'يستطيع الأصدقاء رؤية الكراج الذي تختار مشاركته ومتابعة مشاريعك والانضمام إلى فعالياتك. أضف صديقاً بالبريد الإلكتروني الذي يستخدمه في Garage 197.',
  'A community is a group for people who love the same cars, with its own posts and events. There are none yet, so yours would be the first.': 'المجتمع مجموعة لمحبي السيارات نفسها، له منشوراته وفعالياته. لا توجد مجتمعات بعد، فسيكون مجتمعك الأول.',
  'Events are drives, meets and shows shared with your friends or a community. Nothing is planned yet.': 'الفعاليات هي جولات قيادة ولقاءات ومعارض تشاركها مع أصدقائك أو مع مجتمع. لا شيء مخطط بعد.',
  'How it works': 'كيف يعمل التطبيق',
  'You can bring the list back from the How it works page.': 'يمكنك إعادة القائمة من صفحة «كيف يعمل التطبيق».',
  'Get the most from your garage': 'استفد من كراجك إلى أقصى حد',
  '{a} of {b} done': 'اكتمل {a} من {b}',
  'All done. You are using everything Garage 197 offers.': 'اكتمل كل شيء. أنت تستخدم كل ما يقدمه Garage 197.',
  'Got it': 'فهمت',
  'What’s new': 'ما الجديد',
  'Garage 197 keeps each car’s story, shows what cars like yours sell for, and connects you with people who love the same cars. Here is what each part does.': 'يحفظ Garage 197 قصة كل سيارة، ويعرض أسعار بيع السيارات المشابهة لسيارتك، ويجمعك بمن يحبون السيارات نفسها. إليك ما يفعله كل قسم.',
  'Common questions': 'أسئلة شائعة',
  'Show the getting started list on Home': 'أظهر قائمة البداية في الصفحة الرئيسية',
  'Show the tips again': 'أظهر النصائح من جديد',
  'Tips will show again as you move around the app.': 'ستظهر النصائح من جديد أثناء تنقلك في التطبيق.',
  'Ask us a question': 'اطرح علينا سؤالاً',
  'Build a logbook from your documents: upload photos or PDFs of your paperwork and the app drafts the records for you.': 'أنشئ السجل من مستنداتك: ارفع صوراً أو ملفات PDF لأوراقك وسيُعدّ التطبيق مسودة السجلات لك.',
  'Car projects: track a service, an upgrade or a restoration and get advice from friends.': 'مشاريع السيارات: تابع صيانة أو ترقية أو ترميماً واحصل على نصائح الأصدقاء.',
  'Community on Home: see friends’ new cars, projects and upcoming events.': 'المجتمع في الصفحة الرئيسية: شاهد سيارات أصدقائك الجديدة ومشاريعهم والفعاليات القادمة.',
  'Mercedes-AMG models from 1995 to 2020 are now in the market data.': 'طرازات مرسيدس AMG من 1995 إلى 2020 متوفرة الآن في بيانات السوق.',
  'See what it is worth and start its story.': 'اعرف قيمتها وابدأ قصتها.',
  'Add a photo of your car': 'أضف صورة لسيارتك',
  'It becomes the picture on the car’s card and page.': 'تصبح الصورة المعروضة على بطاقة السيارة وصفحتها.',
  'Build its logbook from your documents': 'أنشئ سجلها من مستنداتك',
  'Upload invoices and papers and the records are drafted for you.': 'ارفع الفواتير والأوراق وستُعدّ السجلات لك.',
  'See what cars like yours sell for': 'اعرف بكم تُباع السيارات المشابهة لسيارتك',
  'Recent sales, the price range and where the market is heading.': 'المبيعات الأخيرة ونطاق الأسعار واتجاه السوق.',
  'Never miss a service, inspection or insurance renewal.': 'لا تفوّت صيانة أو فحصاً أو تجديد تأمين.',
  'Share garages and see what your friends are working on.': 'تشاركوا الكراجات واعرف ما يعمل عليه أصدقاؤك.',
  'Track the work on a car and get advice from friends.': 'تابع العمل على سيارة واحصل على نصائح الأصدقاء.',
  'Hide this list': 'أخفِ هذه القائمة',
  'Close': 'إغلاق',
  'Your garage': 'كراجك',
  'Each car has its own page with an overview, its market, a logbook and projects. Press a car to open it.': 'لكل سيارة صفحتها الخاصة وفيها نظرة عامة وسوقها وسجلها ومشاريعها. اضغط على سيارة لفتحها.',
  'This car’s page': 'صفحة هذه السيارة',
  'Overview shows value and details. Market shows what similar cars sold for. Logbook keeps the history and reminders. Projects tracks work in progress.': '«نظرة عامة» تعرض القيمة والتفاصيل. «السوق» يعرض أسعار بيع السيارات المشابهة. «السجل» يحفظ التاريخ والتذكيرات. «المشاريع» تتابع العمل الجاري.',
  'The logbook': 'السجل',
  'Keep every service, inspection and document here. The quickest way to fill it is “Build from my documents”: upload your paperwork and check the draft.': 'احفظ هنا كل صيانة وفحص ومستند. أسرع طريقة لملئه هي «أنشئ السجل من مستنداتي»: ارفع أوراقك وراجع المسودة.',
  'The market': 'السوق',
  'These are real sold prices. Press any model to see its sales, price range and trend, or search for a car you are thinking of buying.': 'هذه أسعار بيع حقيقية. اضغط على أي طراز لترى مبيعاته ونطاق أسعاره واتجاهه، أو ابحث عن سيارة تفكر في شرائها.',
  'Add friends by the email they use for Garage 197. Switch on sharing in your profile so they can see your cars. They never see prices or documents.': 'أضف الأصدقاء بالبريد الإلكتروني الذي يستخدمونه في Garage 197. فعّل المشاركة في ملفك الشخصي ليروا سياراتك. لا يرون الأسعار أو المستندات أبداً.',
  'Groups for people who love the same cars. Join one to read and write posts and see its events, or start your own.': 'مجموعات لمحبي السيارات نفسها. انضم إلى أحدها لتقرأ المنشورات وتكتبها وترى فعالياتها، أو أنشئ مجتمعك.',
  'Plan a drive or a meet for your friends or a community. People can say whether they are coming.': 'خطط لجولة قيادة أو لقاء لأصدقائك أو لمجتمع. يستطيع الناس تأكيد حضورهم.',
  'Track a service, an upgrade or a restoration step by step. Share it and friends can cheer and suggest tools, equipment and know-how.': 'تابع صيانة أو ترقية أو ترميماً خطوة بخطوة. شاركه ليشجعك الأصدقاء ويقترحوا الأدوات والمعدات والخبرات.',
  'Add each car with its name, year and mileage. Every car gets its own page with a value, photos, a logbook and projects. Home adds them up to show what your garage is worth.': 'أضف كل سيارة باسمها وسنتها والمسافة المقطوعة. تحصل كل سيارة على صفحتها الخاصة وفيها القيمة والصور والسجل والمشاريع. وتجمعها الصفحة الرئيسية لتعرض قيمة كراجك.',
  'The logbook is the car’s history: services, inspections, tyres, documents and what you paid. Choose “Build from my documents”, pick photos or PDFs of your paperwork, and the app drafts one record per document for you to check. You can also add records by hand, attach files, and download the whole logbook as a PDF to show a buyer or an insurer.': 'السجل هو تاريخ السيارة: الصيانة والفحوصات والإطارات والمستندات وما دفعته. اختر «أنشئ السجل من مستنداتي» ثم اختر صوراً أو ملفات PDF لأوراقك، وسيُعدّ التطبيق مسودة سجل لكل مستند لتراجعها. يمكنك أيضاً إضافة السجلات يدوياً وإرفاق الملفات وتنزيل السجل كاملاً بصيغة PDF لعرضه على مشترٍ أو شركة تأمين.',
  'Reminders': 'التذكيرات',
  'In the logbook, add a reminder by date, by mileage, or both. Anything due soon shows on Home and on the car’s page.': 'في السجل، أضف تذكيراً بالتاريخ أو بالمسافة أو بكليهما. كل ما يقترب موعده يظهر في الصفحة الرئيسية وفي صفحة السيارة.',
  'Values and the market': 'القيم والسوق',
  'Each car’s value comes from recent public sales of the same model, and the label beside it says how strong the evidence is. The Market tab shows the latest sales, which models are rising or falling, and lets you look up any model you are thinking of buying.': 'قيمة كل سيارة مأخوذة من مبيعات علنية حديثة للطراز نفسه، والملصق بجانبها يبيّن قوة الدليل. يعرض تبويب السوق أحدث المبيعات والطرازات الصاعدة والهابطة، ويتيح لك البحث عن أي طراز تفكر في شرائه.',
  'Open the market': 'افتح السوق',
  'Friends and sharing': 'الأصدقاء والمشاركة',
  'Add friends by the email they use for Garage 197. If you switch on sharing in your profile, friends see your cars’ names, years, colours, mileage and photos. They never see prices, values, chassis numbers or documents.': 'أضف الأصدقاء بالبريد الإلكتروني الذي يستخدمونه في Garage 197. إذا فعّلت المشاركة في ملفك الشخصي يرى الأصدقاء أسماء سياراتك وسنواتها وألوانها ومسافاتها وصورها. لا يرون الأسعار أو القيم أو أرقام الهياكل أو المستندات أبداً.',
  'Start a project for a service, an upgrade or a restoration. Post updates with photos as the work moves on. If you share it, friends can cheer and suggest equipment, tools and know-how.': 'ابدأ مشروعاً لصيانة أو ترقية أو ترميم. انشر التحديثات بالصور مع تقدم العمل. إذا شاركته يستطيع الأصدقاء تشجيعك واقتراح المعدات والأدوات والخبرات.',
  'Open projects': 'افتح المشاريع',
  'Communities and events': 'المجتمعات والفعاليات',
  'Join a community to talk with people who love the same cars, or start your own. Create events such as a morning drive for your friends or a community.': 'انضم إلى مجتمع لتتحدث مع من يحبون السيارات نفسها، أو أنشئ مجتمعك. أنشئ فعاليات مثل جولة صباحية لأصدقائك أو لمجتمع.',
  'Open communities': 'افتح المجتمعات',
  'Make it yours': 'اجعله على ذوقك',
  'In Settings, choose your language, currency, miles or kilometres, and light or dark mode. On your profile, add your name, photo and city.': 'في الإعدادات اختر اللغة والعملة والأميال أو الكيلومترات والوضع الفاتح أو الداكن. وفي ملفك الشخصي أضف اسمك وصورتك ومدينتك.',
  'Open settings': 'افتح الإعدادات',
  'Who can see my cars?': 'من يستطيع رؤية سياراتي؟',
  'Only you, unless you switch on sharing in your profile. Then your friends see each car’s name, year, model, colour, mileage and photos, and nothing else.': 'أنت فقط، إلا إذا فعّلت المشاركة في ملفك الشخصي. عندها يرى أصدقاؤك اسم كل سيارة وسنتها وطرازها ولونها ومسافتها وصورها، ولا شيء غير ذلك.',
  'How accurate is the value?': 'ما مدى دقة القيمة؟',
  'It is a guide based on real sales of the same model, not a formal valuation. It does not know your car’s condition, history or specification. The evidence label tells you how many sales stand behind it.': 'هي قيمة استرشادية مبنية على مبيعات حقيقية للطراز نفسه، وليست تقييماً رسمياً. لا تعرف حالة سيارتك أو تاريخها أو مواصفاتها. ملصق الدليل يخبرك بعدد المبيعات التي تستند إليها.',
  'My car has no value. Why?': 'سيارتي بلا قيمة. لماذا؟',
  'Either the model is not in the catalogue yet or there are no recent sales on file. Edit the car and pick the model under “More details”, or open its Market tab for links to public results.': 'إما أن الطراز غير موجود في القائمة بعد أو لا توجد مبيعات حديثة مسجلة. عدّل السيارة واختر الطراز من «تفاصيل إضافية»، أو افتح تبويب السوق الخاص بها لروابط النتائج العلنية.',
  'What happens to documents I upload for the AI logbook?': 'ماذا يحدث للمستندات التي أرفعها لسجل الذكاء الاصطناعي؟',
  'They are stored privately in your account and sent to the AI service only when you press “Build from my documents”. Nothing is saved to the logbook until you have checked the draft.': 'تُحفظ بخصوصية في حسابك وتُرسل إلى خدمة الذكاء الاصطناعي فقط عندما تضغط «أنشئ السجل من مستنداتي». لا يُحفظ شيء في السجل حتى تراجع المسودة.',
  'Can I use it on my phone like an app?': 'هل أستطيع استخدامه على هاتفي كتطبيق؟',
  'Yes. Open the site in your phone’s browser and choose “Add to Home Screen” from the share or browser menu. It then opens like any other app.': 'نعم. افتح الموقع في متصفح هاتفك واختر «إضافة إلى الشاشة الرئيسية» من قائمة المشاركة أو المتصفح. بعدها يفتح مثل أي تطبيق آخر.',
  'How do I delete my account?': 'كيف أحذف حسابي؟',
  'Open your profile and choose Delete my account. This removes everything and cannot be undone.': 'افتح ملفك الشخصي واختر «احذف حسابي». هذا يزيل كل شيء ولا يمكن التراجع عنه.',
  'We couldn’t match this car to a model in the catalogue, which covers classic Porsche, Mercedes-Benz SL, Mercedes-AMG and Alfa Romeo models. Edit the car and pick the model under “More details”. Meanwhile these searches open public results:': 'لم نتمكن من مطابقة هذه السيارة مع طراز في الفهرس، الذي يغطي طرازات بورشه الكلاسيكية ومرسيدس-بنز SL ومرسيدس-AMG وألفا روميو. عدّل السيارة واختر الطراز من «تفاصيل أكثر». وحتى ذلك الحين تفتح هذه الروابط نتائج علنية:',
  'Alfa Romeo 164 to Brera': 'ألفا روميو من 164 إلى بريرا',
  'Alfa Romeo 1900, 2000 and 2600': 'ألفا روميو 1900 و2000 و2600',
  'Alfa Romeo Alfasud and 33': 'ألفا روميو ألفاسود و33',
  'Alfa Romeo Giulia coupés': 'ألفا روميو جوليا كوبيه',
  'Alfa Romeo Giulia saloons and Berlinas': 'ألفا روميو جوليا سيدان وبرلينا',
  'Alfa Romeo Giulietta and early Giulia': 'ألفا روميو جولييتا وجوليا الأولى',
  'Alfa Romeo Montreal, Alfetta and 75': 'ألفا روميو مونتريال وألفيتا و75',
  'Alfa Romeo Spider': 'ألفا روميو سبايدر',
  'Modern Alfa Romeo': 'ألفا روميو الحديثة',
  'Pre-war Alfa Romeo and 6C': 'ألفا روميو ما قبل الحرب و6C',
  'Alfa Romeo models from the last five years of sales are now in the market data.': 'طرازات ألفا روميو ومبيعاتها في السنوات الخمس الأخيرة متوفرة الآن في بيانات السوق.',
  'Make': 'الشركة المصنّعة',
  'Name (optional)': 'الاسم (اختياري)',
  'A name of your own for this car. Leave empty to use the make and model.': 'اسم تختاره أنت لهذه السيارة. اتركه فارغاً لاستخدام الشركة المصنّعة والطراز.',
  'e.g. Porsche': 'مثال: Porsche',
  'e.g. 911 (964) Turbo 3.3': 'مثال: 911 (964) Turbo 3.3',
  'e.g. The weekend car': 'مثال: سيارة نهاية الأسبوع',
